name: release

# Fires only on a version tag. Nothing is published until you push one:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  packages: write # push image + charts to GHCR

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # ratchet:docker/setup-buildx-action@v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # ratchet:docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sandbox-operator
          # The v-prefixed tag is NOT optional: charts/sandbox-operator
          # defaults image.tag to (printf "v%s" .Chart.AppVersion), so a
          # release publishing only "0.1.0" leaves every default install in
          # ImagePullBackOff. Publish both forms.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # ratchet:docker/build-push-action@v7
        with:
          context: .
          file: images/operator/Dockerfile
          # arm64 included so this runs on Pi/Graviton clusters, not just x86.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # ratchet:azure/setup-helm@v5
      - name: Package and push charts as OCI artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"          # v0.1.0 -> 0.1.0
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

          # --version/--app-version are passed explicitly so the packaged
          # filename is derived from the tag rather than from whatever is
          # committed in Chart.yaml. Hardcoding the version is exactly how
          # the predecessor of this workflow rotted into pushing a .tgz that
          # no longer existed.
          for chart in sandbox-operator sandbox-isolation; do
            helm package "charts/$chart" --version "$VERSION" --app-version "$VERSION" -d dist/
            helm push "dist/${chart}-${VERSION}.tgz" \
              "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done

  release:
    needs: [image, charts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Stage release assets
        id: stage
        run: |
          set -euo pipefail
          # Actions expressions cannot strip the leading "v"; do it here and
          # hand the bare semver to the steps below.
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # The CRD is the one file you need before the chart will install.
          cp crd/sandbox-crd.yaml dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # ratchet:softprops/action-gh-release@v3
        with:
          files: dist/sandbox-crd.yaml
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            kubectl create namespace sandboxes
            kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sandbox-crd.yaml

            helm install sandbox-operator \
              oci://ghcr.io/${{ github.repository_owner }}/charts/sandbox-operator \
              --version ${{ steps.stage.outputs.version }} --namespace sandboxes

            # The guardrails. Read docs/isolation.md first — the defaults deny
            # more than you may expect, which is the intent.
            helm install sandbox-isolation \
              oci://ghcr.io/${{ github.repository_owner }}/charts/sandbox-isolation \
              --version ${{ steps.stage.outputs.version }} --namespace sandboxes
            ```

            You still supply a runtime image — see `docs/runtime-image.md`.
