# Repo-wide ruff config (sessions ruff-debt fix). Written when CI came back
# to life (2026-08-11) and an unpinned `pip install ruff` picked up 0.16's
# expanded default ruleset. Rules live here, the version pin lives in
# .github/workflows/ci.yaml — bump both deliberately, together.

[lint]
# Keep ruff's (0.16) defaults, minus:
#
# BLE001 (blind `except Exception`): every flagged site is a reconciliation
# boundary that converts *any* failure into a Sandbox status condition the
# user can read. Catching narrowly there would turn a legible
# reason=VaultSetupFailed into an operator traceback nobody sees. Blind
# catches anywhere else still deserve a review comment, but the linter
# cannot tell the difference.
ignore = ["BLE001"]
