[project]
name = "sandbox-operator"
version = "0.1.0"
description = "Kubernetes operator that runs coding-agent CLIs as isolated per-user sandboxes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Rothstein" }]
keywords = ["kubernetes", "operator", "ai", "agents", "sandbox"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "kopf>=1.37",
  "kubernetes>=29.0",
  "hvac>=2.1",
]

[project.urls]
Homepage = "https://github.com/andrewrothstein/sandbox-operator"
Issues = "https://github.com/andrewrothstein/sandbox-operator/issues"

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sandbox_operator"]
