apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-operator
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: sandboxes
rules:
  # Sandbox CRDs
  - apiGroups: ["sandboxes.dev"]
    resources: ["sandboxes", "sandboxes/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Sub-resources the operator manages
  - apiGroups: [""]
    resources: ["pods", "services", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API — HTTPRoutes for Envoy Gateway ingress
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # kopf needs CRD discovery, events, and leases for leader election
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-operator
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-operator
subjects:
  - kind: ServiceAccount
    name: sandbox-operator
    namespace: {{ .Values.namespace }}
